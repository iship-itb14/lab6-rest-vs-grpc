[project]
name = "lab6-rest-vs-grpc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "elgood", email = "eric.goodman@colorado.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "flask>=3.1.3",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "jsonpickle>=4.1.2",
